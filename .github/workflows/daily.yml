name: Daily claim

on:
  schedule:
    - cron: "30 17 * * *" # 00:30 GMT+7
    - cron: "0 13 * * *" # 20:00 GMT+7
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run the claimer
        env:
          DISCORDTOKEN: ${{ secrets.DISCORDTOKEN }}
          TELETOKEN: ${{ secrets.TELETOKEN }}
        run: python -m nh_income claim
