[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nh-income"
version = "2.0.0"
description = "Automated daily income claimer for KageHero Studio events."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dot-1x" }]
keywords = ["nhentai", "income", "automation", "claimer"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "discord.py>=2.3",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
]

[project.scripts]
nh-income = "nh_income.__main__:main"

[project.urls]
Homepage = "https://github.com/dot-1x/nh_income"

[tool.hatch.build.targets.wheel]
packages = ["nh_income"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008", # argparse defaults into function arguments is fine for CLI
    "E501", # long lines in string constants (embed bodies)
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"__main__.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["nh_income"]
